pre-commit:
  parallel: true
  commands:
    prettier:
      glob: "*.{ts,js,svelte,css,md,json,yml,yaml}"
      run: pnpm prettier --check {staged_files} || true
    eslint:
      glob: "*.{ts,js,svelte}"
      run: pnpm eslint {staged_files} || true
    typecheck:
      glob: "*.{ts,svelte}"
      run: pnpm check || true
    unit-test-changed:
      glob: "*.{ts,svelte}"
      run: pnpm vitest run --changed || true

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1} || true
