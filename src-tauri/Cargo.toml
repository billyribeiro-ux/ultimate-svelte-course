[package]
name = "ultimate-svelte-course"
version = "0.1.0"
description = "Ultimate Svelte Course — native desktop edition"
authors = ["Ultimate Svelte Course"]
edition = "2021"
rust-version = "1.77"

# The `_lib` suffix may seem unnecessary but it is required to make the lib name
# unique and wouldn't conflict with the bin name. This seems to be only an issue
# on Windows, see https://github.com/rust-lang/cargo/issues/8519.
[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "macos-private-api"] }
tauri-plugin-shell = "2"
portpicker = "0.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
